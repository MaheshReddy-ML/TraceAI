[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "traceai-local"
version = "0.2.0"
description = "Local-first, evidence-based model behavior observability"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6,<7", "rich>=13.9,<15"]

[project.optional-dependencies]
transformers = ["transformers>=4.45", "torch>=2.4"]
mlx = ["mlx-lm>=0.20; platform_system == 'Darwin' and platform_machine == 'arm64'"]
s3 = ["boto3>=1.35,<2"]
llama_cpp = ["llama-cpp-python>=0.3,<1"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
traceai = "traceai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
